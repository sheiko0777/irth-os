name = "irth-api"
# account_id: set CLOUDFLARE_ACCOUNT_ID env or run: wrangler login
# 2024-09-23 is the cutoff where `nodejs_compat` switches to v2 behaviour,
# which provides `process` and the node:net/node:tls needed by postgres-js.
# Below it the Worker did not merely fail to reach Postgres — it failed to
# START: "Uncaught ReferenceError: process is not defined" at packages/db.
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = "src/index.ts"

[vars]
NODE_ENV = "production"
# Base URL for the admin app's /join page — used to build the link in
# invite emails (orgs.ts's POST /:id/invite). Not a secret, so it lives here
# rather than behind `wrangler secret put`, mirroring apps/admin's own
# NEXT_PUBLIC_APP_URL. Falls back to https://app.irth-house.com if unset.
ADMIN_APP_URL = "https://app.irth-house.com"
# This Worker's own public base URL — used to build the multi-tenant OAuth
# callback (routes/shopify.ts) and per-org webhook registration URLs
# (services/shopifyConnection.ts). Not a secret, same reasoning as
# ADMIN_APP_URL above. `apiBaseUrl()` falls back to http://localhost:3001 if
# this is unset — that fallback is fine for local dev, but if this var is
# ever missing in a deployed environment, every OAuth callback silently
# points at localhost. Was previously undocumented here despite being read.
#
# Verified against the real deployment — read from Deploy All run
# 33234368901's own logs ("Uploaded irth-api... https://irth-api.irth-os-api.workers.dev"),
# confirmed live via GET .../health -> {"status":"ok","db":"up"}. No custom
# domain attached as of that run.
SHOPIFY_APP_URL = "https://irth-api.irth-os-api.workers.dev"

# Secrets managed via: wrangler secret put <KEY>
# DATABASE_URL, BETTER_AUTH_SECRET, PAYMOB_API_KEY, PAYMOB_HMAC_SECRET,
# BOSTA_API_KEY, BOSTA_ACCOUNT_ID, ETA_CLIENT_ID, ETA_CLIENT_SECRET,
# ETA_ISSUER_EIN, RESEND_API_KEY, ARCJET_KEY,
# SHOPIFY_APP_CLIENT_ID, SHOPIFY_APP_CLIENT_SECRET, SHOPIFY_SHOP_DOMAIN,
# SHOPIFY_ORG_ID (which org the legacy single-tenant Shopify webhooks write
# into when no shopify_connections row matches the incoming shop domain —
# see apps/api/src/routes/webhooks/shopify.ts),
# SHOPIFY_TOKEN_ENCRYPTION_KEY (base64-encoded 32-byte AES-256-GCM key,
# encrypts every per-org shopify_connections.access_token_ciphertext — see
# apps/api/src/services/shopifyConnection.ts. Was read by that file but
# never listed here; verify it's actually set with
# `wrangler secret list --name irth-api` before relying on the connect flow —
# missing it throws at first use, not at deploy time)

# Fires the `scheduled` handler in src/index.ts, which drains the outbox.
#
# The outbox producers were wired up before any consumer existed: events were
# written on every order transition and nothing ever read them, so no
# notification was ever delivered. A Worker isolate does not outlive the request
# that created it, so a setInterval-based worker (which is what this repo had)
# can never fire — a cron trigger is the only mechanism that runs without an
# inbound request.
#
# Every minute is the finest granularity Cloudflare cron offers. Combined with
# the batch ceiling in index.ts this drains up to 100 events/minute; raise the
# frequency here before raising that ceiling, so a backlog never risks hitting
# the CPU limit mid-send.
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

# NOTE: nothing in src/ references this binding today. Left declared, but if you
# start using `env.R2`, repeat this block under [env.production] and
# [env.staging] as well — like [triggers] above, bindings are NOT inherited by
# named environments, so it would be present in dev and undefined in production.
# `wrangler deploy --dry-run --env production` warns about exactly this.
[[r2_buckets]]
binding = "R2"
bucket_name = "irth-assets"

[env.production]
name = "irth-api"
# Repeated deliberately: a named environment does NOT inherit the top-level
# [vars]/[triggers]. ADMIN_APP_URL has a same-value code fallback (orgs.ts),
# so omitting it here is harmless — set explicitly anyway so this block
# stays the single place every var this deployment needs is visible.
# Omitting the cron, on the other hand, ships with a silently undrained
# outbox (the original bug this comment block exists to fix).
vars = { NODE_ENV = "production", ADMIN_APP_URL = "https://app.irth-house.com", SHOPIFY_APP_URL = "https://irth-api.irth-os-api.workers.dev" }
triggers = { crons = ["* * * * *"] }

[env.staging]
name = "irth-api-staging"
# Not independently verified like the production value above — same
# irth-os-api.workers.dev account subdomain, unconfirmed whether Cloudflare's
# naming for a *named environment* worker matches this pattern exactly.
# Check `wrangler deployments list --name irth-api-staging` (or the staging
# deploy's own logs) before relying on this for a real OAuth connect.
vars = { NODE_ENV = "staging", ADMIN_APP_URL = "https://app.irth-house.com", SHOPIFY_APP_URL = "https://irth-api-staging.irth-os-api.workers.dev" }
triggers = { crons = ["* * * * *"] }
