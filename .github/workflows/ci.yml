name: CI Pipeline

on:
  pull_request:
    branches: [main]
  workflow_call:
    secrets:
      TEST_DATABASE_URL:
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo lint typecheck test

  migration-check:
    name: migration-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch origin main
        run: git fetch origin main:origin/main || git fetch origin main
      - name: Run migration check
        run: node packages/db/scripts/check-migrations.mjs

  # Browser smoke test: a production build of the admin against a throwaway
  # Postgres (a service container created and destroyed with this job, never a
  # shared or production database), every migration applied, a real login.
  # It walks the screens an operator uses on day one — dashboard, orders, a
  # blocked Shopify order and its resolution — so a page that fails to render
  # turns CI red instead of being found in production. See
  # apps/admin/playwright.config.ts and apps/admin/e2e/.
  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: irth_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/irth_e2e
      BETTER_AUTH_SECRET: ci-e2e-only-secret-not-used-anywhere-else
      NEXT_PUBLIC_APP_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Apply every migration to the throwaway database
        run: pnpm --filter @irth/db db:migrate
      - name: Install Chromium for Playwright
        run: pnpm --filter @irth/admin exec playwright install --with-deps chromium
      - name: Production build of the admin
        run: pnpm --filter @irth/admin build
      - name: Playwright smoke
        run: pnpm --filter @irth/admin test:e2e
      - name: Keep the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/admin/playwright-report
            apps/admin/test-results
          retention-days: 7

  # Runs against a real Postgres branch. The unit suite above mocks `db`
  # wholesale, so it cannot exercise a constraint, a trigger, or an RLS policy —
  # every rule the database is supposed to enforce is invisible to it.
  #
  # This job is deliberately NOT conditional on the secret being present. A gate
  # that silently skips itself when misconfigured is not a gate; if
  # TEST_DATABASE_URL is missing the suite fails with instructions rather than
  # reporting a green tick it did not earn.
  #
  # CONCURRENCY: this job runs against ONE shared, persistent Neon branch —
  # globalSetup.ts claims it once via a marker table rather than provisioning a
  # fresh branch per run, and every integration test file truncates every table
  # in its own beforeAll. Two invocations of this job at once — e.g. a push to
  # main that touches both apps/api/** and apps/admin/**, which fires
  # deploy-api.yml AND deploy-admin.yml, and each independently calls this
  # workflow with secrets: inherit — race on that one branch: one run's
  # truncateAll() can erase the fixtures another run just inserted mid-test.
  #
  # Caught live on 58b98aa (PR #211's merge): both workflows' `integration` job
  # started in the same second and both failed, on exactly the assertions that
  # depend on isolated state (an idempotency-key collision check, a stock guard
  # concurrency count) — never before that day, because until #211 nothing had
  # touched both apps/api/** and apps/admin/** in one push. Deploy has 0/19
  # successful runs in this repo's history for reasons layered on top of this
  # one, but this was the first time gates itself was the failure.
  #
  # The group is a fixed literal, not an expression like `github.workflow` —
  # that resolves to the CALLING workflow's name ("Deploy API" vs "Deploy
  # Admin") when this runs via workflow_call, which would give the two
  # invocations different groups and not serialize them at all. cancel-in-
  # progress is false: the goal is queueing onto the one shared branch, not
  # cancelling one deploy's gate because another happened to start first.
  integration:
    runs-on: ubuntu-latest
    needs: test
    concurrency:
      group: shared-neon-integration-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      # The `secrets` context is not available in a step-level `if`, so the
      # check reads an env var instead. Written as an `if:` condition it would
      # evaluate to false forever and never fire — a guard that cannot fail.
      - name: Check the test database is configured
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: |
          if [ -z "$TEST_DATABASE_URL" ]; then
            echo "::error title=TEST_DATABASE_URL is not set::Add a repository secret TEST_DATABASE_URL pointing at a DISPOSABLE Postgres branch (never the app database). The integration suite truncates every table it touches."
            exit 1
          fi

      - name: Integration tests
        env:
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
        run: pnpm --filter @irth/admin test:integration
