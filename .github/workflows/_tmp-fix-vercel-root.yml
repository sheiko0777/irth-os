name: (temp) Fix irth-os Vercel rootDirectory

on:
  workflow_dispatch:
  push:
    branches:
      - chore/tmp-fix-vercel-root

jobs:
  fix-root-directory:
    runs-on: ubuntu-latest
    steps:
      - name: Set rootDirectory=apps/admin on the irth-os project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          # prj_2fujImzGD6fFjiejgryMmCKermvU is "irth-os": a blank project
          # Vercel's git integration auto-provisioned via remote-URL detection
          # (see the comment in deploy-admin.yml). rootDirectory=null there
          # means it tries to build the monorepo root on every PR and fails.
          PROJECT_ID="prj_2fujImzGD6fFjiejgryMmCKermvU"

          echo "--- before ---"
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            | tee /tmp/before.json | python3 -c "import json,sys; d=json.load(sys.stdin); print('name:', d.get('name')); print('rootDirectory:', d.get('rootDirectory')); print('framework:', d.get('framework'))"

          echo "--- patching ---"
          HTTP_CODE=$(curl -sS -o /tmp/patch_response.json -w "%{http_code}" \
            -X PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            -d '{"rootDirectory":"apps/admin"}')
          echo "HTTP $HTTP_CODE"
          cat /tmp/patch_response.json
          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Vercel API returned $HTTP_CODE"
            exit 1
          fi

          echo ""
          echo "--- after ---"
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('name:', d.get('name')); print('rootDirectory:', d.get('rootDirectory')); print('framework:', d.get('framework'))"

  compare-with-admin-project:
    runs-on: ubuntu-latest
    needs: fix-root-directory
    steps:
      - name: Read irth-os-admin's settings for comparison
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        run: |
          set -euo pipefail
          curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/prj_9nInO3kK3tmRjEBXEc0H6SFj5W1C?teamId=$VERCEL_ORG_ID" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('name:', d.get('name')); print('rootDirectory:', d.get('rootDirectory')); print('framework:', d.get('framework')); print('buildCommand:', d.get('buildCommand')); print('link.productionBranch:', (d.get('link') or {}).get('productionBranch'))"
