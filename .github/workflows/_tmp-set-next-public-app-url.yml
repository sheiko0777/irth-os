name: _tmp set NEXT_PUBLIC_APP_URL

on:
  workflow_dispatch:

jobs:
  set:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # NEXT_PUBLIC_* vars are inlined into the client bundle at BUILD time,
      # so this must be type Plain (Sensitive vars are withheld from the
      # build step, same trap as DATABASE_URL earlier). auth-client.ts falls
      # back to http://localhost:3000 when this is unset, which is exactly
      # why signUp.email()/signIn.email() fail with "Failed to fetch" in a
      # real visitor's browser - it's calling their own loopback address.
      - name: Add NEXT_PUBLIC_APP_URL (Plain, Production)
        run: echo "https://app.irth-house.com" | vercel env add NEXT_PUBLIC_APP_URL production --no-sensitive --force --token=${{ secrets.VERCEL_TOKEN }}

      - name: Confirm
        run: vercel env ls production --token=${{ secrets.VERCEL_TOKEN }}
