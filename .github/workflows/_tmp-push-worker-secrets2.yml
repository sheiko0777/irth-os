name: (temp) Push worker secrets 2
on: workflow_dispatch

jobs:
  push-secrets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Push secrets to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.ARCJET_KEY }}" | npx wrangler@4 secret put ARCJET_KEY
          echo "${{ secrets.RESEND_API_KEY }}" | npx wrangler@4 secret put RESEND_API_KEY
          echo "${{ secrets.BOSTA_API_KEY }}" | npx wrangler@4 secret put BOSTA_API_KEY
