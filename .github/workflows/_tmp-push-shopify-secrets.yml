name: (temp) Push Shopify secrets to worker
on: workflow_dispatch

jobs:
  push-secrets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Push Shopify secrets to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "${{ secrets.SHOPIFY_APP_CLIENT_ID }}" | npx wrangler@4 secret put SHOPIFY_APP_CLIENT_ID
          echo "${{ secrets.SHOPIFY_APP_CLIENT_SECRET }}" | npx wrangler@4 secret put SHOPIFY_APP_CLIENT_SECRET
          echo "${{ vars.SHOPIFY_SHOP_DOMAIN }}" | npx wrangler@4 secret put SHOPIFY_SHOP_DOMAIN
