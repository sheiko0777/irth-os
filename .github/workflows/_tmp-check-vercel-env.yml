name: _tmp check vercel env

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: List production env vars
        run: vercel env ls production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull production env and show NEXT_PUBLIC_APP_URL
        run: |
          vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          echo "--- .vercel/.env.production.local (NEXT_PUBLIC only) ---"
          grep -i "NEXT_PUBLIC" .vercel/.env.production.local || echo "no NEXT_PUBLIC_* vars found in pulled env"
