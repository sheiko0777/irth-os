name: (temp) Push auth secret to worker
on: workflow_dispatch

jobs:
  push-secret:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - name: Push BETTER_AUTH_SECRET to Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.BETTER_AUTH_SECRET_GEN }}" | npx wrangler@4 secret put BETTER_AUTH_SECRET
