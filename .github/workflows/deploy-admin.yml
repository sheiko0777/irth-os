name: Deploy Admin

on:
  push:
    branches:
      - main
    paths:
      - 'apps/admin/**'
      # Same reasoning as deploy-api.yml: a schema-only change must still
      # trigger this workflow, since (see the migration step below) this
      # workflow now migrates before serving traffic through the admin
      # app's own Better Auth instance.
      - 'packages/db/**'
  workflow_call:

jobs:
  gates:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    needs: gates
    runs-on: ubuntu-latest
    env:
      # Pinning these explicitly because `vercel pull` with only --token and
      # no linked .vercel/project.json falls back to git-remote-based
      # project auto-detection — which silently created and kept re-linking
      # to a *different*, blank auto-provisioned project ("irth-os", no
      # Root Directory, no framework, no env vars) instead of the real
      # "irth-os-admin" project configured in the dashboard. That ghost
      # project is why builds failed with "No Output Directory named
      # 'public'" and why BETTER_AUTH_SECRET (set on the real project)
      # was never seen.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.30.3

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # This workflow triggers independently of deploy-api.yml on the same
      # push (both are plain `push: branches: [main]`, gated only by path
      # filters — there is no `needs:` between them for an ordinary push,
      # only for the manual deploy-all.yml). Without its own migration step,
      # this job could deploy and start serving traffic against a database
      # that doesn't have a migration from the SAME push applied yet — and
      # since `betterAuth()` validates the full schema at construction time
      # (apps/admin/src/lib/auth-server.ts's lazy Proxy builds it on first
      # request), a schema mismatch there 500s every sign-in, not just a
      # feature depending on the new column. That is exactly the incident
      # fixed in #337 (see packages/db/drizzle/0066's own comment) — this
      # step exists so this workflow can never reproduce it on its own
      # rollout. Idempotent (packages/db/scripts/migrate.mjs tracks its own
      # ledger), so running it here too, alongside deploy-api.yml's own
      # identical step, is safe even when both happen to run for the same
      # push.
      - name: Snapshot DB before migrating
        run: bash packages/db/scripts/pre-migrate-snapshot.sh pre-migrate-admin
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}

      - name: Run DB Migrations
        run: pnpm --filter @irth/db db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Vercel's own build step below runs `next build` itself (with the
      # project's Root Directory set to apps/admin in the Vercel project
      # settings), so there is no separate `pnpm --filter @irth/admin build`
      # here — doing it twice would waste the whole job's runtime for nothing.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build on Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      # Same discipline as deploy-api.yml's smoke test: a deploy that uploads
      # successfully but serves a broken app is a false-green deploy. Curl the
      # real production alias, not the one-off preview URL Vercel just
      # printed, so this actually proves app.irth-house.com works.
      - name: Smoke test the deployed app
        run: |
          URL="${{ vars.ADMIN_HEALTH_URL }}"
          if [ -z "$URL" ]; then
            echo "::error title=ADMIN_HEALTH_URL not set::Add the repository variable ADMIN_HEALTH_URL (e.g. https://app.irth-house.com/ar/login). Without it a deploy cannot be verified and a broken build ships silently."
            exit 1
          fi
          echo "Probing $URL"
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /tmp/smoke.txt -w "%{http_code}" --max-time 20 "$URL" || echo 000)
            echo "attempt $i -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Admin app is serving."; exit 0
            fi
            sleep 10
          done
          echo "::error title=Admin app did not serve 200::Last response:"
          cat /tmp/smoke.txt || true
          exit 1
