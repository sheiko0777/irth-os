name: Deploy All

on:
  workflow_dispatch:
  # TEMPORARY: this session's GitHub App token lacks `actions:write`, so
  # workflow_dispatch cannot be triggered via the API (confirmed 403 Resource
  # not accessible by integration). A push scoped to this file's own path is
  # the only way to fire a real run without that permission. Reverted in the
  # very next commit — do not leave this in.
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-all.yml'

jobs:
  deploy-api:
    uses: ./.github/workflows/deploy-api.yml
    secrets: inherit

  deploy-admin:
    needs: deploy-api
    uses: ./.github/workflows/deploy-admin.yml
    secrets: inherit
